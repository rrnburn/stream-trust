name: Generate Test Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate debug keystore
        run: |
          keytool -genkeypair \
            -keystore streaminstuff-debug.keystore \
            -storetype JKS \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify keystore
        run: keytool -list -keystore streaminstuff-debug.keystore -storepass android -alias androiddebugkey

      - name: Print Base64 value for GitHub secret
        run: |
          {
            echo "### Your ANDROID_DEBUG_KEYSTORE_BASE64 secret value"
            echo ""
            echo "Copy the entire block below and add it as a repository secret named \`ANDROID_DEBUG_KEYSTORE_BASE64\`"
            echo "(Settings → Secrets and variables → Actions → New repository secret):"
            echo ""
            echo '```'
            base64 -w 0 streaminstuff-debug.keystore
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
